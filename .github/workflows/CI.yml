name: CI

on: [push]

concurrency:
  group: relewise-sdk-java-integration-dataset
  cancel-in-progress: false
  queue: max

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Generate Java classes
        run: ./generate.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn --batch-mode -DskipTests package --file src/pom.xml

      - name: Load version into generated .properties file.
        run: mvn resources:resources --file src/pom.xml

      - name: Seed integration fixtures
        run: mvn --batch-mode -Dtest=IntegrationSeed test --file src/pom.xml
        env:
          DATASET_ID: 24e8aba9-1e21-46b2-8fad-6fffa956bd3b
          API_KEY: ${{ secrets.INTEGRATION_TESTS_DATASET_API_KEY }}
          SERVER_URL: https://sandbox-api.relewise.com/

      - name: Test
        run: mvn --batch-mode -Dmaven.test.failure.ignore=true test --file src/pom.xml
        env:
          DATASET_ID: 24e8aba9-1e21-46b2-8fad-6fffa956bd3b
          API_KEY: ${{secrets.INTEGRATION_TESTS_DATASET_API_KEY}}
          SERVER_URL: https://sandbox-api.relewise.com/

      - name: Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: src/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
