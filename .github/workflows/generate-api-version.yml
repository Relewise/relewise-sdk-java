name: Generate API Version

on:
  workflow_call:
    inputs:
      api-version:
        description: Exact published Relewise.Client version (for example 1.320.0)
        required: true
        type: string
      trello-card-url:
        description: Trello card URL
        required: true
        type: string
  workflow_dispatch:
    inputs:
      api-version:
        description: Exact published Relewise.Client version (for example 1.320.0)
        required: true
        type: string
      trello-card-url:
        description: Trello card URL
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  REVIEWERS: mzanoni,soe-relewise
  TARGET_REPOSITORY: Relewise/relewise-sdk-java
  API_VERSION: ${{ inputs['api-version'] }}

jobs:
  wait-for-package:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Wait for exact NuGet package
        run: python3 .github/restore-generator.py --version "$API_VERSION" --wait-seconds 3600

  generate-api-version:
    needs: wait-for-package
    runs-on: ubuntu-latest
    concurrency:
      group: relewise-sdk-java-integration-dataset
      cancel-in-progress: false
      queue: max

    steps:
      - name: Validate workflow input
        shell: pwsh
        env:
          TRELLO_CARD_URL_INPUT: ${{ inputs['trello-card-url'] }}
        run: |
          $trelloCardUrl = $env:TRELLO_CARD_URL_INPUT

          if ([string]::IsNullOrWhiteSpace($trelloCardUrl)) {
            throw 'A Trello card URL is required. Provide the trello-card-url input.'
          }

          "TRELLO_CARD_URL=$trelloCardUrl" >> $env:GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: main
          token: ${{ secrets.SDK_UPDATE_TOKEN || github.token }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore generator
        run: python3 .github/restore-generator.py --version "$API_VERSION"

      - name: Build generator
        run: dotnet build Generator/Generator.csproj --configuration Release --no-restore -p:RelewiseClientVersion="[$API_VERSION]"

      - name: Generate Java classes
        run: dotnet run --project Generator --configuration Release --no-build --no-restore -- src/src/main/java/com/relewise/client

      - name: Check generated changes
        id: changes
        shell: pwsh
        run: |
          $changes = git status --porcelain -- src/src/main/java/com/relewise/client
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect generated Java source changes.' }

          if ([string]::IsNullOrWhiteSpace($changes)) {
            "has_changes=false" >> $env:GITHUB_OUTPUT
            "No Java SDK changes were produced for API version $env:API_VERSION. No pull request was created." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "has_changes=true" >> $env:GITHUB_OUTPUT
            "Java SDK changes were produced for API version $env:API_VERSION." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Set up JDK 17
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Resolve next Maven package version
        if: steps.changes.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          [xml]$pom = Get-Content 'src/pom.xml' -Raw
          $namespace = New-Object System.Xml.XmlNamespaceManager($pom.NameTable)
          $namespace.AddNamespace('m', 'http://maven.apache.org/POM/4.0.0')

          $versionNode = $pom.SelectSingleNode('/m:project/m:version', $namespace)

          if ($null -eq $versionNode -or [string]::IsNullOrWhiteSpace($versionNode.InnerText)) {
            throw 'Could not find project version in src/pom.xml.'
          }

          $currentVersion = $versionNode.InnerText.Trim()

          if ($currentVersion -notmatch '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$') {
            throw "Current Maven version '$currentVersion' is not a supported major.minor.patch version."
          }

          $nextVersion = '{0}.{1}.0' -f $Matches.major, ([int]$Matches.minor + 1)

          "SDK_VERSION=$nextVersion" >> $env:GITHUB_ENV
          "Resolved next Maven package version $nextVersion from current version $currentVersion." >> $env:GITHUB_STEP_SUMMARY

      - name: Update Maven package version
        if: steps.changes.outputs.has_changes == 'true'
        run: mvn --batch-mode versions:set -DnewVersion=${{ env.SDK_VERSION }} -DgenerateBackupPoms=false --file src/pom.xml

      - name: Build
        if: steps.changes.outputs.has_changes == 'true'
        run: mvn --batch-mode -DskipTests package --file src/pom.xml

      - name: Load version into generated .properties file
        if: steps.changes.outputs.has_changes == 'true'
        run: mvn resources:resources --file src/pom.xml

      - name: Seed integration fixtures
        if: steps.changes.outputs.has_changes == 'true'
        run: mvn --batch-mode -Dtest=IntegrationSeed test --file src/pom.xml
        env:
          DATASET_ID: 24e8aba9-1e21-46b2-8fad-6fffa956bd3b
          API_KEY: ${{ secrets.INTEGRATION_TESTS_DATASET_API_KEY }}
          SERVER_URL: https://sandbox-api.relewise.com/

      - name: Test
        if: steps.changes.outputs.has_changes == 'true'
        env:
          DATASET_ID: 24e8aba9-1e21-46b2-8fad-6fffa956bd3b
          API_KEY: ${{ secrets.INTEGRATION_TESTS_DATASET_API_KEY }}
          SERVER_URL: https://sandbox-api.relewise.com/
        run: mvn --batch-mode test --file src/pom.xml

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SDK_UPDATE_TOKEN || github.token }}
        run: |
          $branch = "chore/update-sdk-api-$env:API_VERSION-${{ github.run_number }}"
          $commitMessage = "chore(java): update SDK for API version $env:API_VERSION"
          $title = "feat: API version $env:API_VERSION"
          $bodyPath = Join-Path $env:RUNNER_TEMP 'generate-api-version-pr-body.md'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $branch
          git add -A src
          git commit -m $commitMessage
          git push --set-upstream origin $branch

          @(
            $env:TRELLO_CARD_URL
            ''
            '## Summary'
            "- Generated Java SDK code for Relewise.Client $env:API_VERSION."
            ''
            '## Validation'
            '- Restored and verified the exact requested Relewise.Client version.'
            '- dotnet build Generator/Generator.csproj --configuration Release --no-restore'
            "- Updated src/pom.xml version to $env:SDK_VERSION"
            '- Generated Java classes using the verified Release build without another restore.'
            '- mvn --batch-mode -DskipTests package --file src/pom.xml'
            '- mvn resources:resources --file src/pom.xml'
            '- mvn --batch-mode -Dtest=IntegrationSeed test --file src/pom.xml'
            '- mvn --batch-mode test --file src/pom.xml'
          ) | Set-Content -Path $bodyPath

          gh pr create `
            --repo $env:TARGET_REPOSITORY `
            --base main `
            --head $branch `
            --title $title `
            --body-file $bodyPath `
            --reviewer $env:REVIEWERS

          "Created pull request '$title' from '$branch'." >> $env:GITHUB_STEP_SUMMARY
