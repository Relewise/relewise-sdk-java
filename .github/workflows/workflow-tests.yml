name: Workflow regression tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test exact-version restore
        run: bash .github/test_restore_generator.sh
      - name: Test generated-change detection
        shell: pwsh
        run: ./.github/test_generated_changes.ps1
